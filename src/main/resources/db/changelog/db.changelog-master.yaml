              - column:
                  name: currency
                  value: "THB"
              - column:
                  name: balance
                  value: 1000.00
              - column:
                  name: status
                  value: "ACTIVE"
        - insert:
            tableName: account
            columns:
              - column:
                  name: account_number
                  value: "0000001002"
              - column:
                  name: owner_name
                  value: "สมหญิง มีเงิน"
              - column:
                  name: currency
                  value: "THB"
              - column:
                  name: balance
                  value: 5000.00
              - column:
                  name: status
                  value: "ACTIVE"
