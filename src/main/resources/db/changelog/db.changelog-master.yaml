databaseChangeLog:
  - changeSet:
      id: create-account-table
      author: developer
      changes:
        - createTable:
            tableName: account
            columns:
              - column:
                  name: id
                  type: BIGINT IDENTITY(1,1)
                  constraints:
                    primaryKey: true
              - column:
                  name: account_number
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: owner_name
                  type: NVARCHAR(120)
                  constraints:
                    nullable: false
              - column:
                  name: currency
                  type: VARCHAR(3)
                  constraints:
                    nullable: false
              - column:
                  name: balance
                  type: DECIMAL(19,4)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(10)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: DATETIME
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: DATETIME
                  constraints:
                    nullable: false
        - addDefaultValue:
            columnName: balance
            tableName: account
            defaultValue: 0
        - addDefaultValue:
            columnName: status
            tableName: account
            defaultValue: ACTIVE
        - addDefaultValue:
            columnName: created_at
            tableName: account
            defaultValueComputed: SYSUTCDATETIME()
        - addDefaultValue:
            columnName: updated_at
            tableName: account
            defaultValueComputed: SYSUTCDATETIME()
        - sql:
            sql: ALTER TABLE account ADD CONSTRAINT CK_account_balance CHECK (balance >= 0)
        - sql:
            sql: ALTER TABLE account ADD CONSTRAINT CK_account_status CHECK (status IN ('ACTIVE','FROZEN','CLOSED'))

  - changeSet:
      id: create-transfer-table
      author: developer
      changes:
        - createTable:
            tableName: transfer
            columns:
              - column:
                  name: id
                  type: BIGINT IDENTITY(1,1)
                  constraints:
                    primaryKey: true
              - column:
                  name: idempotency_key
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: from_account_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: to_account_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: amount
                  type: DECIMAL(19,4)
                  constraints:
                    nullable: false
              - column:
                  name: currency
                  type: VARCHAR(3)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(12)
                  constraints:
                    nullable: false
              - column:
                  name: request_hash
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: failure_reason
                  type: NVARCHAR(255)
              - column:
                  name: created_at
                  type: DATETIME
                  constraints:
                    nullable: false
        - addDefaultValue:
            columnName: created_at
            tableName: transfer
            defaultValueComputed: SYSUTCDATETIME()
        - sql:
            sql: ALTER TABLE transfer ADD CONSTRAINT CK_transfer_amount CHECK (amount > 0)
        - sql:
            sql: ALTER TABLE transfer ADD CONSTRAINT CK_transfer_status CHECK (status IN ('PENDING','COMPLETED','FAILED'))

  - changeSet:
      id: create-ledger-entry-table
      author: developer
      changes:
        - createTable:
            tableName: ledger_entry
            columns:
              - column:
                  name: id
                  type: BIGINT IDENTITY(1,1)
                  constraints:
                    primaryKey: true
              - column:
                  name: account_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: transfer_id
                  type: BIGINT
              - column:
                  name: type
                  type: VARCHAR(6)
                  constraints:
                    nullable: false
              - column:
                  name: amount
                  type: DECIMAL(19,4)
                  constraints:
                    nullable: false
              - column:
                  name: balance_after
                  type: DECIMAL(19,4)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: DATETIME
                  constraints:
                    nullable: false
        - addDefaultValue:
            columnName: created_at
            tableName: ledger_entry
            defaultValueComputed: SYSUTCDATETIME()
        - sql:
            sql: ALTER TABLE ledger_entry ADD CONSTRAINT CK_ledger_type CHECK (type IN ('DEBIT','CREDIT'))
        - sql:
            sql: ALTER TABLE ledger_entry ADD CONSTRAINT CK_ledger_amount CHECK (amount > 0)
        - createIndex:
            indexName: idx_account_id
            tableName: ledger_entry
            columns:
              - column:
                  name: account_id
        - createIndex:
            indexName: idx_transfer_id
            tableName: ledger_entry
            columns:
              - column:
                  name: transfer_id

  - changeSet:
      id: create-outbox-event-table
      author: developer
      changes:
        - createTable:
            tableName: outbox_event
            columns:
              - column:
                  name: id
                  type: BIGINT IDENTITY(1,1)
                  constraints:
                    primaryKey: true
              - column:
                  name: aggregate_type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: aggregate_id
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: event_type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: payload
                  type: NVARCHAR(MAX)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(10)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: DATETIME
                  constraints:
                    nullable: false
              - column:
                  name: published_at
                  type: DATETIME
        - addDefaultValue:
            columnName: status
            tableName: outbox_event
            defaultValue: PENDING
        - addDefaultValue:
            columnName: created_at
            tableName: outbox_event
            defaultValueComputed: SYSUTCDATETIME()
        - sql:
            sql: ALTER TABLE outbox_event ADD CONSTRAINT CK_outbox_status CHECK (status IN ('PENDING','PUBLISHED','FAILED'))

  - changeSet:
      id: add-foreign-keys
      author: developer
      changes:
        - addForeignKeyConstraint:
            baseTableName: transfer
            baseColumnNames: from_account_id
            referencedTableName: account
            referencedColumnNames: id
            constraintName: fk_transfer_from_account
        - addForeignKeyConstraint:
            baseTableName: transfer
            baseColumnNames: to_account_id
            referencedTableName: account
            referencedColumnNames: id
            constraintName: fk_transfer_to_account
        - addForeignKeyConstraint:
            baseTableName: ledger_entry
            baseColumnNames: account_id
            referencedTableName: account
            referencedColumnNames: id
            constraintName: fk_ledger_entry_account
        - addForeignKeyConstraint:
            baseTableName: ledger_entry
            baseColumnNames: transfer_id
            referencedTableName: transfer
            referencedColumnNames: id
            constraintName: fk_ledger_entry_transfer

  - changeSet:
      id: seed-sample-accounts
      author: developer
