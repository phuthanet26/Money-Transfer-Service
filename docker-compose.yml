version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: money-transfer-sqlserver
    environment:
      ACCEPT_EULA: Y
      SA_PASSWORD: YourStrong@Passw0rd
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P YourStrong@Passw0rd -C -Q "SELECT 1"
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - money-transfer-network

  redis:
    image: redis:7-alpine
    container_name: money-transfer-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: redis-cli ping
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - money-transfer-network

  ibmmq:
    image: icr.io/ibm-messaging/mq:latest
    container_name: money-transfer-ibmmq
    environment:
      - LICENSE=accept
      - MQ_QMGR_NAME=QM1
    ports:
      - "1414:1414"
      - "9443:9443"
    healthcheck:
      test: dspmq
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - money-transfer-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: money-transfer-app
    ports:
      - "8082:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:sqlserver://sqlserver:1433;databaseName=MoneyTransferDB;trustServerCertificate=true;sendStringParametersAsUnicode=true;encrypt=false
      - SPRING_DATASOURCE_USERNAME=sa
      - SPRING_DATASOURCE_PASSWORD=YourStrong@Passw0rd
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - IBM_MQ_CONN_NAME=ibmmq(1414)
      - IBM_MQ_QUEUE-MANAGER=QM1
      - IBM_MQ_CHANNEL=DEV.APP.SVRCONN
      - IBM_MQ_SSL_ENABLED=false
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
      ibmmq:
        condition: service_healthy
    networks:
      - money-transfer-network

volumes:
  sqlserver_data:
    driver: local

networks:
  money-transfer-network:
    driver: bridge
